name: CI

# Lean, self-contained CI (2026-06-15 rewrite).
# The previous "Quality Gate" pipeline never ran: it failed at startup (a
# mis-indented `retention-days` step key), used retired action versions,
# installed `bc` via pip (a system tool), and selected a P0/P1/P2 test
# taxonomy that does not exist in the suite. Large parts of the test suite
# also need a live Postgres + OpenAI key, unavailable here.
#
# This version is deliberately minimal and dependency-free: it validates the
# workflow files, smoke-tests imports, and runs the database-free logic tests
# (verified green without DB/secrets). Full integration coverage (Postgres
# service + secrets + fixing pre-existing test breakage) is a separate, larger
# task — see decisions-log / tethr-gesamtplan-dev.

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main ]

env:
  PYTHON_VERSION: "3.11"

jobs:
  workflow-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: actionlint (validate this workflow)
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color .github/workflows/quality-gate.yml

  unit-logic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies (poetry, deps only)
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry install --no-interaction --no-root

      - name: Import smoke test
        run: |
          poetry run python -c "import mcp_server, mcp_server.consent_policy, mcp_server.graph_vocabulary, mcp_server.tools.insights.update, mcp_server.tools.insights.delete; print('imports ok')"

      - name: Database-free logic tests
        run: |
          poetry run python -m pytest \
            tests/unit/test_update_insight.py \
            tests/unit/test_delete_insight.py \
            -p no:warnings -v
